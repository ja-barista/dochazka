<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Docházka</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a6e44">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #16181a; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #nacitani {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #8a9099; font-size: 15px; background: #16181a;
  }
</style>
</head>
<body>

<div id="nacitani">Načítám docházku…</div>

<!-- Sem patří adresa panelu. Končí na ?ak=PANEL – bez tajného klíče. -->
<iframe
  id="panel"
  src="https://script.google.com/macros/s/AKfycbz_uQBx0zuJS5V4YyWATWWBYpKt1vpzvwlhNP7j9rbc2W2YauxOR8SL4YtM8x9X4FAT/exec?ak=PANEL"
  onload="document.getElementById('nacitani').style.display='none'">
</iframe>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>

</body>
</html>
